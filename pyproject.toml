[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "container-trust"
version = "1.0.0"
description = "Container-provenance admission gate: refuses any image it cannot trace to a signed build from known source, with staged enforcement (warn -> block), per-namespace policy, and a break-glass path so failing closed never takes prod down."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vinzabe", email = "gabejar@usa.com" }]
keywords = ["security", "supply-chain", "containers", "admission-control", "provenance", "sigstore"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
ctrust = "ctrust.cli:main"

[project.urls]
Homepage = "https://github.com/vinzabe/container-trust"
Issues = "https://github.com/vinzabe/container-trust/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrust"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ctrust"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "S101", "ARG001", "ARG002", "ARG005", "F841"]
